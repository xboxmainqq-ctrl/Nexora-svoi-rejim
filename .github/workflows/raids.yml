name: Build NEXORA Raids
on:
  push:
    paths:
      - "plugins/NEXORA_Raids/**"
      - ".github/workflows/raids.yml"
  pull_request:
    paths:
      - "plugins/NEXORA_Raids/**"
      - ".github/workflows/raids.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Raids
        working-directory: plugins/NEXORA_Raids
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Raids
          path: plugins/NEXORA_Raids/target/*.jar
