name: Build NEXORA plugins
on:
  push:
    paths:
      - "plugins/NEXORA_Beasts/**"
      - ".github/workflows/beasts.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Beasts
        working-directory: plugins/NEXORA_Beasts
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Beasts
          path: plugins/NEXORA_Beasts/target/*.jar
