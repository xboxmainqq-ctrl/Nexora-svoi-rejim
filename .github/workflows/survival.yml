name: Build NEXORA Survival
on:
  push:
    paths:
      - "plugins/NEXORA_Survival/**"
      - ".github/workflows/survival.yml"
  pull_request:
    paths:
      - "plugins/NEXORA_Survival/**"
      - ".github/workflows/survival.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Survival
        working-directory: plugins/NEXORA_Survival
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Survival
          path: plugins/NEXORA_Survival/target/*.jar
