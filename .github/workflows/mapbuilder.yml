name: Build NEXORA MapBuilder
on:
  push:
    paths:
      - "plugins/NEXORA_MapBuilder/**"
      - ".github/workflows/mapbuilder.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        working-directory: plugins/NEXORA_MapBuilder
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_MapBuilder
          path: plugins/NEXORA_MapBuilder/target/*.jar
