name: Build NEXORA Regions
on:
  push:
    paths:
      - "plugins/NEXORA_Regions/**"
      - ".github/workflows/regions.yml"
  pull_request:
    paths:
      - "plugins/NEXORA_Regions/**"
      - ".github/workflows/regions.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Regions
        working-directory: plugins/NEXORA_Regions
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Regions
          path: plugins/NEXORA_Regions/target/*.jar
