name: Build NEXORA Quests
on:
  push:
    paths:
      - "plugins/NEXORA_Quests/**"
      - ".github/workflows/quests.yml"
  pull_request:
    paths:
      - "plugins/NEXORA_Quests/**"
      - ".github/workflows/quests.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Quests
        working-directory: plugins/NEXORA_Quests
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Quests
          path: plugins/NEXORA_Quests/target/*.jar
