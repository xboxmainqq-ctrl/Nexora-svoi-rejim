name: Build NEXORA Realistic WorldGen

on:
  push:
    paths:
      - "plugins/NEXORA_RealisticWorldGen/**"
  pull_request:
    paths:
      - "plugins/NEXORA_RealisticWorldGen/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/NEXORA_RealisticWorldGen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build plugin
        run: mvn -B -U clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-RealisticWorldGen
          path: plugins/NEXORA_RealisticWorldGen/target/*.jar
          if-no-files-found: error