name: Build NEXORA Dungeons
on:
  push:
    paths:
      - "plugins/NEXORA_Dungeons/**"
      - ".github/workflows/dungeons.yml"
  pull_request:
    paths:
      - "plugins/NEXORA_Dungeons/**"
      - ".github/workflows/dungeons.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build NEXORA_Dungeons
        working-directory: plugins/NEXORA_Dungeons
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA_Dungeons
          path: plugins/NEXORA_Dungeons/target/*.jar
