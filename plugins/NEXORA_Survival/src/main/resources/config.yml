chat:
  enabled: true
  format: "§8[§r{prefix}§8] {clan} §f{name}§7: §f{message}"

default-rank: player
ranks:
  player: {prefix: "§7Игрок", homes: 3, kits: [start, daily]}
  vip: {prefix: "§bVIP", label: "VIP", homes: 6, kits: [start, daily, vip]}
  premium: {prefix: "§dPREMIUM", label: "PREMIUM", homes: 8, kits: [start, daily, vip]}
  elite: {prefix: "§dELITE", label: "ELITE", homes: 12, kits: [start, daily, vip]}
  legend: {prefix: "§6LEGEND", label: "LEGEND", homes: 16, kits: [start, daily, vip]}
  moder: {prefix: "§9Модер", label: "МОДЕР", homes: 10, kits: [start, daily, vip]}
  admin: {prefix: "§cАдмин", label: "АДМИН", homes: 20, kits: [start, daily, vip]}

start-kit-on-first-join: true
# cooldown-hours: 0 means the kit can be taken only once.
kits:
  start:
    name: "Стартовый набор"
    cooldown-hours: 0
    items: ["272:0:1", "273:0:1", "274:0:1", "275:0:1", "364:0:16", "50:0:16"]
  daily:
    name: "Ежедневный набор"
    cooldown-hours: 24
    items: ["364:0:8", "50:0:16", "260:0:4"]
  vip:
    name: "VIP-набор"
    cooldown-hours: 72
    items: ["264:0:2", "364:0:16"]
