# NEXORA_Survival settings.
# Item ids are legacy numeric ids: "id:meta:count". Keep the quotes around ids used as keys.

teleport:
  warmup-seconds: 3          # stand still this long before a teleport (admins skip it)
  cooldown-seconds: 10       # pause between teleports (admins skip it)
  tpa-timeout-seconds: 60    # how long a /tpa request stays valid
  spawn-protect-radius: 16   # nobody but admins can build this close to the spawn (0 = off)

