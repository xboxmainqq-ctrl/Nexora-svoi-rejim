# Отдельная линейка административных рангов NEXORA.
# Названия рангов (label) и их градиентные буквы зашиты в плагине и в ресурспаке,
# здесь настраиваются только лимиты домов и наборы.
# staff = ГЛАВНЫЙ АДМИНИСТРАТОР (выдаётся: /adminrank <игрок> staff, подходит и chief_admin).
ranks:
  helper: {label: "ХЕЛПЕР", homes: 3, kits: [start, daily]}
  junior_moder: {label: "МЛАДШИЙ МОДЕРАТОР", homes: 3, kits: [start, daily]}
  moder: {label: "МОДЕРАТОР", homes: 10, kits: [start, daily, vip]}
  senior_moder: {label: "СТАРШИЙ МОДЕРАТОР", homes: 10, kits: [start, daily, vip]}
  admin: {label: "АДМИНИСТРАТОР", homes: 20, kits: [start, daily, vip]}
  staff: {label: "ГЛАВНЫЙ АДМИНИСТРАТОР", homes: 20, kits: [start, daily, vip]}
