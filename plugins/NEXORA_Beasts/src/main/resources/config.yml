# NEXORA: BEASTS settings

# true  - every pet looks like the creature of its rarity (resource pack
#         "rarity looks": wolf, turtle, blue wolf, tiger, lion, kitsune,
#         stag, angel, abyss dragon, star dragon).
# false - pets keep the look of their species.
rarity-looks: true

# true  - rarity word above the pet is drawn with the gradient letters from the
#         NEXORA resource pack (font/glyph_E2.png). Needs the pack on the client;
#         without it the client shows empty squares.
# false - classic coloured text (works everywhere).
gradient-glyphs: false

# true  - a particle aura around the owner, shape/colour by the highest rarity
#         among summoned pets (hidden while sneaking).
player-aura: true

# true  - the aura uses the custom particles of the NEXORA resource pack (magic
#         circles with runes, sparkles, petals, feathers, halo...). Needs the pack.
# false - simple dust-particle aura that works without the pack.
# If the server cannot send custom particles it falls back to the dust aura itself.
custom-particles: true
