name: NEXORA_Beasts
main: ru.nexora.beasts.NEXORABeasts
version: "0.1.0-SNAPSHOT"
api: ["1.0.0"]
author: NEXORA
description: "Creature collection, egg hatching and wild taming for NEXORA: BEASTS"
commands:
  beasts:
    description: NEXORA creature system
    usage: "/beasts help"
    aliases: ["beast"]
  aura:
    description: NEXORA standalone aura menu
    usage: "/aura"
    aliases: ["auras"]
permissions:
  nexora.beasts.use:
    description: Use the NEXORA creature system
    default: true
  nexora.beasts.aura:
    description: Open and manage personal auras
    default: true
  nexora.beasts.admin:
    description: Give NEXORA eggs and capture spheres
    default: op
