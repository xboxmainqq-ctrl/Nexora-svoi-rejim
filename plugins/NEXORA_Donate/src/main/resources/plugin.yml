name: NEXORA_Donate
main: ru.nexora.donate.NEXORADonate
version: "1.1.0"
api: ["1.0.0"]
author: NEXORA
description: "Каталог и система донат-привилегий NEXORA"
commands:
  donate:
    description: Открыть каталог донат-привилегий NEXORA
    usage: "/donate"
    aliases: ["донат", "привилегии"]
  donaterank:
    description: Выдать или снять донат-привилегию
    usage: "/donaterank <игрок> <ранг|remove>"
permissions:
  nexora.donate.manage:
    description: Управление донат-привилегиями NEXORA
    default: op
